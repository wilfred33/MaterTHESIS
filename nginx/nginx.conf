# Proxy de l'étape 3 : une seule porte d'entrée devant les deux services.
events {}

http {
    upstream notes    { server notes:8000; }
    upstream projects { server projects:8000; }

    server {
        listen 80;

        # /projects/{id}/notes -> service notes
        location ~ ^/projects/[^/]+/notes$ {
            proxy_pass http://notes;
        }

        # Tout le reste -> service projets
        location / {
            proxy_pass http://projects;
        }
    }
}
