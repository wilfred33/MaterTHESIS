# Proxy de la région B.
# Projet de la région B -> services locaux ; sinon -> proxy de la région A.
events {}

http {
    include /etc/nginx/routage.conf;

    upstream notes_b    { server notes-b:8000; }
    upstream projects_b { server projects-b:8000; }

    # L'adresse de l'autre proxy est cherchée à chaque requête (DNS de Docker),
    # pas au démarrage : les deux proxys peuvent démarrer dans n'importe quel ordre.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Destination selon la région du projet
    map $region_projet $vers_notes {
        B        notes_b;
        default  nginx-a:80;
    }
    map $region_projet $vers_projects {
        B        projects_b;
        default  nginx-a:80;
    }

    server {
        listen 80;

        # Montre par quelles régions la requête est passée
        add_header X-Region B always;

        # /projects/{id}/notes -> service notes de la bonne région
        location ~ ^/projects/[^/]+/notes$ {
            proxy_pass http://$vers_notes;
        }

        # /projects/{id} -> service projets de la bonne région
        location ~ ^/projects/[^/]+$ {
            proxy_pass http://$vers_projects;
        }

        # Tout le reste (POST /projects, /docs...) -> service projets local
        location / {
            proxy_pass http://projects_b;
        }
    }
}
