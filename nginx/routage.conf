# Table de routage, la même pour les deux régions : projet -> région.
# Un projet absent de la table va vers la région par défaut.

# Identifiant du projet lu dans l'URL : /projects/{id} ou /projects/{id}/notes
map $uri $projet {
    ~^/projects/(?<id>[^/]+)  $id;
    default                   "";
}

map $projet $region_projet {
    default  A;
    p1       A;
    p2       B;
}
