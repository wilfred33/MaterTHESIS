# Étape 0 : CouchDB. Étape 1 : service notes. Étape 2 : service projets. Étape 3 : proxy nginx.
services:
  couchdb:
    image: couchdb:3.4
    container_name: couchdb
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/_up"]
      interval: 2s
      retries: 30

  notes:
    build: ./notes
    container_name: notes
    environment:
      COUCHDB_URL: http://admin:admin@couchdb:5984
    ports:
      - "8001:8000"
    depends_on:
      couchdb:
        condition: service_healthy

  projects:
    build: ./projects
    container_name: projects
    environment:
      COUCHDB_URL: http://admin:admin@couchdb:5984
      REGION: A
    ports:
      - "8002:8000"
    depends_on:
      couchdb:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - notes
      - projects

volumes:
  couchdb-data:
